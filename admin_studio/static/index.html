<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peak Season · Admin Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<link rel="stylesheet" href="/static/studio.css">
</head>
<body>
<header>
  <h1>Peak Season <span>Admin Studio</span></h1>
  <nav id="tabs">
    <button data-t="ui" class="on">App Copy</button>
    <button data-t="corpus">Shared Corpus</button>
    <button data-t="items">Product Texts</button>
    <button data-t="images">Images</button>
    <button data-t="icons">Icons</button>
    <button data-t="logos">Logos</button>
    <button data-t="links">Links</button>
  </nav>
  <input type="search" id="q" placeholder="Search…" autofocus>
  <span id="dirty"></span>
  <span id="csv"><button class="btn" id="exp">Export CSV</button><button class="btn" id="imp">Import CSV</button><input type="file" id="file" accept=".csv,text/csv" hidden></span>
  <button class="btn primary" id="save" disabled>Save Changes</button>
</header>
<div id="layout">
  <main id="main"></main>
  <aside id="build">
    <h2>Build &amp; Deploy</h2>
    <div id="status">Checking…</div>
    <div class="actions">
      <button class="btn" id="sync">Sync App</button>
      <button class="btn primary" id="apk">Build Android APK</button>
      <button class="btn" id="apkdir">Open APK Folder</button>
    </div>
    <details id="howto"><summary>How to test your changes</summary><div id="howto_text"></div></details>
    <pre id="log" hidden></pre>
  </aside>
</div>
<div id="modal" hidden><div class="card"><h3 id="m_title"></h3><div id="m_body"></div><button class="btn primary" id="m_ok">Got It</button></div></div>
<div id="msg"></div>
<script src="/static/core.js"></script>
<script src="/static/copy.js"></script>
<script src="/static/images.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/sources.js"></script>
<script src="/static/build.js"></script>
</body>
</html>
